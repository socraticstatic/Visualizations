name: Release chart-color-system

# Publishes dist-lib to npm with provenance when a lib-v* tag is pushed.
#
# Auth: npm trusted publishing (OIDC) — configure once on npmjs.com:
# package chart-color-system → Settings → Trusted Publisher → GitHub Actions,
# repo socraticstatic/Visualizations, workflow release-lib.yml.
# After that, no token and no 2FA tap is ever needed: `git tag lib-v0.7.3 &&
# git push origin lib-v0.7.3` is the entire release.

#
# It can also be run by hand from the Actions tab, on main only. A manual run
# publishes the version in package.json, then creates the lib-vX.Y.Z tag
# itself. A tag created by the workflow's own token does not start a second
# run.

on:
  push:
    tags: ["lib-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm provenance + trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # a manual run creates the tag
      id-token: write
    steps:
      - name: Manual runs release from main only
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not $GITHUB_REF."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          # NO registry-url: setup-node would write a placeholder _authToken
          # to .npmrc, which overrides OIDC trusted publishing.
      # Trusted publishing (OIDC token exchange) requires npm >= 11.5.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Tag must match package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#lib-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag lib-v$TAG != package.json $PKG" >&2; exit 1
          fi
      - run: npm test
      - run: npm run build:lib
      - run: npm publish ./dist-lib --provenance --access public
      - name: Tag the release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/lib-v$VERSION" -f sha="$GITHUB_SHA"
