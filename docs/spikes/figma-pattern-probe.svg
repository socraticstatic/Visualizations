<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
  <defs>
    <pattern id="p1" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#ffffff"/>
      <path d="M0 0 L20 0 L20 8 L0 8 Z" fill="#000000"/>
    </pattern>
    <pattern id="p2" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#ffffff"/>
      <path d="M0 0 L20 0 L20 8 L0 8 Z" fill="#000000"/>
    </pattern>
    <pattern id="p3" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#ffffff"/>
      <circle cx="8" cy="8" r="5" fill="#000000"/>
    </pattern>
  </defs>
  <rect x="20"  y="20" width="220" height="220" fill="url(#p1)" stroke="#ff0000" stroke-width="4"/>
  <rect x="270" y="20" width="220" height="220" fill="url(#p2)" stroke="#ff0000" stroke-width="4"/>
  <rect x="520" y="20" width="220" height="220" fill="url(#p3)" stroke="#ff0000" stroke-width="4"/>
  <rect x="770" y="20" width="220" height="220" fill="#00ff00" stroke="#ff0000" stroke-width="4"/>
  <text x="20"  y="285" font-size="26" fill="#ffffff">1 stripes</text>
  <text x="270" y="285" font-size="26" fill="#ffffff">2 stripes rotate45</text>
  <text x="520" y="285" font-size="26" fill="#ffffff">3 dots</text>
  <text x="770" y="285" font-size="26" fill="#ffffff">4 solid control</text>
</svg>
