<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    The mark is the product's own argument.

    Three series, each with a distinct colour AND a distinct dash rhythm AND a
    distinct marker. The lightness steps are wide enough that the mark stays
    legible when the colour is removed, which is the claim the tool makes about
    every palette it writes. An icon for this plugin that failed greyscale
    would be self-refuting.
  -->
  <rect width="128" height="128" rx="28" fill="#14171a"/>

  <!-- slot 1: solid, circle, lightest -->
  <line x1="24" y1="40" x2="104" y2="40" stroke="#ebf2f9" stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="40" r="10" fill="#ebf2f9"/>

  <!-- slot 2: long dash, triangle, mid -->
  <line x1="24" y1="64" x2="104" y2="64" stroke="#a8c7e6" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 11"/>
  <polygon points="64,53 74,72 54,72" fill="#a8c7e6"/>

  <!-- slot 3: short dash, square, darkest -->
  <line x1="24" y1="88" x2="104" y2="88" stroke="#659cd2" stroke-width="7" stroke-linecap="round" stroke-dasharray="6 9"/>
  <rect x="55" y="79" width="18" height="18" rx="3" fill="#659cd2"/>
</svg>
